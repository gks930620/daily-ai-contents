name: daily-contents

on:
  schedule:
    - cron: "30 21 * * *" # 매일 06:30 KST (21:30 UTC)
  workflow_dispatch:
    inputs:
      topics:
        description: "생성할 주제 (all 또는 slug 나열, 예: weather mbti)"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: daily-contents
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate contents
        run: node scripts/generate.js ${{ github.event.inputs.topics || 'all' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}

      - name: Build site
        run: node scripts/build-site.js
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          SITE_NAME: ${{ vars.SITE_NAME || 'AI 데일리' }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data docs
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: daily contents $(TZ=Asia/Seoul date +%F)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
